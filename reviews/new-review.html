<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Review - TextSwap</title>
    <link rel="stylesheet" href="../assets/base.css">
    <link rel="stylesheet" href="reviews.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <div class="navbar__logo">
                <a href="../index.html">📚 TextSwap</a>
            </div>
            <ul class="navbar__links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../forum/forum-list.html">Discussion Forum</a></li>
                <li><a href="../cart/products.html">Shopping Cart</a></li>
                <li><a href="../blog/blog-list.html">Blog</a></li>
                <li><a href="../reviews/review-list.html" class="active">Reviews</a></li>
                <li><a href="../wishlist/wishlist.html">Wishlist</a></li>
            </ul>
            <div class="navbar__actions">
                <a href="../account/login.html" class="btn btn-outline">Login</a>
                <a href="../account/register.html" class="btn btn-primary">Sign Up</a>
            </div>
        </nav>
    </header>
<main>
    <section class="section">
        <div class="container">
            <h1 class="text-center">Write a Review</h1>
            <p class="text-center text-muted mt-sm">Share your thoughts about a textbook or seller.</p>
            <form class="form mt-lg">
                <div class="form-group">
                    <label for="book-title">Book Title</label>
                    <input type="text" id="book-title" name="book-title" placeholder="e.g. The Muse: Misunderstandings and Their Remedies">
                    <span class="error-message" id="book-title-error"></span>
                </div>
                <div class="form-group">
                    <label for="rating">Star Rating</label>
                    <select id="rating" name="rating">
                        <option value="5">⭐⭐⭐⭐⭐ (5 stars)</option>
                        <option value="4">⭐⭐⭐⭐☆ (4 stars)</option>
                        <option value="3">⭐⭐⭐☆☆ (3 stars)</option>
                        <option value="2">⭐⭐☆☆☆ (2 stars)</option>
                        <option value="1">⭐☆☆☆☆ (1 star)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reviewer-name">Your Name</label>
                    <input type="text" id="reviewer-name" name="reviewer-name" placeholder="e.g. Jane Doe">
                    <span class="error-message" id="reviewer-name-error"></span>
                </div>
                <div class="form-group">
                    <label for="review-content">Review Content</label>
                    <textarea id="review-content" name="review-content" placeholder="Share your experience with this book or seller..."></textarea>
                    <span class="error-message" id="reviewer-content-error"></span>
                </div>
                <div class="form-group">
                    <label for="review-image">Upload an Image (optional)</label>
                    <input type="file" id="review-image" name="review-image" accept="image/*">
                </div>

                <button type="submit" class="btn btn-primary">Submit Review</button>


            </form>
        </div>
    </section>

</main>
<footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 TextSwap - Secondhand Textbook Exchange Platform</p>
            <p class="mt-sm">
                <a href="../sitemap.html">Sitemap</a> |
                <a href="../account/login.html">Login</a> |
                <a href="../account/register.html">Register</a>
            </p>
        </div>
    </footer>
    <script src="reviews.js"></script>
</body>
</html>
